[project]
name = "macro-qgis-core"
version = "1.0.0"
description = "Core library for recording and playing back QGIS macros."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["qgis_plugin_tools>=2.0.0"]

[project.urls]
homepage = "https://macro-qgis-plugin.readthedocs.io"
repository = "https://github.com/Joonalai/macro-qgis-plugin"


[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.build-backend]
module-name = "qgis_macros"
include = ["py.typed"]
